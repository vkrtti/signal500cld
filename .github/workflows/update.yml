name: Update data

on:
  schedule:
    - cron: '30 22 * * 1-5'   # every weekday after the US close (22:30 UTC)
    - cron: '0 6 * * 6'       # Saturday 06:00 UTC: weekly roll (buy amount, meter, rankings, demo account)
  workflow_dispatch:
    inputs:
      weekly:
        description: 'Also run the weekly roll'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - name: Update data
        run: |
          if [ "${{ github.event.schedule }}" = "0 6 * * 6" ] || [ "${{ inputs.weekly }}" = "true" ]; then
            python scripts/update.py --weekly
          else
            python scripts/update.py
          fi
      - name: Long-history research (Saturday / manual weekly runs)
        if: github.event.schedule == '0 6 * * 6' || inputs.weekly == true
        continue-on-error: true
        run: python scripts/research.py
      - name: Write run summary
        if: always()
        run: if [ -f work/summary.md ]; then cat work/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Commit updated data
        run: |
          git config user.name "signal500-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data research_data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Data update $(date -u +%F)"
            git push
          fi
