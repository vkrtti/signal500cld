name: Update data

on:
  schedule:
    - cron: '30 22 * * 1-5'   # every weekday after the US close (22:30 UTC)
    - cron: '17 6 * * 6'       # Saturday 06:17 UTC (off the hour: GitHub drops on-the-hour runs under load): weekly roll (main index pick, buy amount, meter, stock picks, demo account)
    - cron: '47 9 * * 6'       # Saturday 09:47 UTC: second try (the 06:17 run did not fire on 2026-10-24 and 06:00 not on 2026-10-17; a same-day rerun is safe)
    - cron: '17 6 * * 0'       # Sunday 06:17 UTC: retry of the weekly roll (does nothing new if Saturday worked)
  workflow_dispatch:
    inputs:
      weekly:
        description: 'Also run the weekly roll'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pandas numpy yfinance || (sleep 20 && pip install pandas numpy yfinance)
      - name: Weekly roll or daily update?
        id: mode
        # Weekly when: a Saturday/Sunday cron, a manual run with weekly=true, or the Friday 22:30 cron firing after
        # midnight UTC (GitHub starts it ~3 h late, so it lands on Saturday ~01:45 UTC, after Friday's close; the
        # Saturday crons often do not fire at all). A roll without Friday's closes stops itself and a later run retries.
        run: |
          W=false
          case "${{ github.event.schedule }}" in "17 6 * * 6"|"47 9 * * 6"|"17 6 * * 0") W=true ;; esac
          [ "${{ inputs.weekly }}" = "true" ] && W=true
          [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" -ge 6 ] && W=true
          echo "weekly=$W" >> "$GITHUB_OUTPUT"; echo "weekly=$W (UTC weekday $(date -u +%u))"
      - name: Update data
        run: |
          if [ "${{ steps.mode.outputs.weekly }}" = "true" ]; then
            python scripts/update.py --weekly
          else
            python scripts/update.py
          fi
      - name: Headlines
        continue-on-error: true
        run: python scripts/news.py docs/data
      - name: Long-history research (Saturday / manual weekly runs)
        if: steps.mode.outputs.weekly == 'true'
        continue-on-error: true
        run: python scripts/research.py
      - name: Write run summary
        if: always()
        run: if [ -f work/summary.md ]; then cat work/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Commit updated data
        run: |
          git config user.name "indexpilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data research_data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Data update $(date -u +%F)"
            git push
          fi
