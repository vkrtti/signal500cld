name: Update data

on:
  schedule:
    - cron: '30 22 * * 1-5'   # every weekday after the US close (22:30 UTC)
    - cron: '17 6 * * 6'       # Saturday 06:17 UTC (off the hour: GitHub drops on-the-hour runs under load): weekly roll (main index pick, buy amount, meter, stock picks, demo account)
    - cron: '17 6 * * 0'       # Sunday 06:17 UTC: retry of the weekly roll (does nothing new if Saturday worked)
  workflow_dispatch:
    inputs:
      weekly:
        description: 'Also run the weekly roll'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pandas numpy yfinance || (sleep 20 && pip install pandas numpy yfinance)
      - name: Update data
        run: |
          if [ "${{ github.event.schedule }}" = "17 6 * * 6" ] || [ "${{ github.event.schedule }}" = "17 6 * * 0" ] || [ "${{ inputs.weekly }}" = "true" ]; then
            python scripts/update.py --weekly
          else
            python scripts/update.py
          fi
      - name: Headlines
        continue-on-error: true
        run: python scripts/news.py docs/data
      - name: Long-history research (Saturday / manual weekly runs)
        if: github.event.schedule == '17 6 * * 6' || github.event.schedule == '17 6 * * 0' || inputs.weekly == true
        continue-on-error: true
        run: python scripts/research.py
      - name: Write run summary
        if: always()
        run: if [ -f work/summary.md ]; then cat work/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Commit updated data
        run: |
          git config user.name "indexpilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data research_data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Data update $(date -u +%F)"
            git push
          fi
