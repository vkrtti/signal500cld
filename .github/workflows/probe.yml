name: Probe sources
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36'
          p() { code=$(curl -sS -A "$UA" -o /tmp/o -w '%{http_code}' --max-time 30 "$1"); echo "$code $(wc -c </tmp/o) $1 :: $(head -c 160 /tmp/o | tr -d '\n')"; }
          p 'https://query1.finance.yahoo.com/v8/finance/chart/EUNL.DE?period1=1293840000&period2=1760000000&interval=1d'
          p 'https://query2.finance.yahoo.com/v8/finance/chart/SAP.DE?range=2y&interval=1d'
          p 'https://query1.finance.yahoo.com/v8/finance/chart/7203.T?range=2y&interval=1d'
          p 'https://query1.finance.yahoo.com/v8/finance/chart/IEMA.AS?range=2y&interval=1d'
          p 'https://stooq.com/q/d/l/?s=eunl.de&i=d'
          p 'https://www.federalreserve.gov/feeds/press_all.xml'
          p 'https://www.ecb.europa.eu/rss/press.html'
          p 'https://www.boj.or.jp/en/rss/whatsnew.xml'
          p 'https://www.cnbc.com/id/100003114/device/rss/rss.html'
          p 'https://www.cnbc.com/id/20910258/device/rss/rss.html'
          p 'https://feeds.content.dowjones.io/public/rss/mw_topstories'
          p 'https://feeds.finance.yahoo.com/rss/2.0/headline?s=SAP.DE&region=US&lang=en-US'
          p 'https://finance.yahoo.com/news/rssindex'
          p 'https://news.google.com/rss/search?q=stock+market&hl=en-US&gl=US&ceid=US:en'
          p 'https://www.investing.com/rss/news_25.rss'
          p 'https://fred.stlouisfed.org/graph/fredgraph.csv?id=SP500&cosd=2026-09-01'
